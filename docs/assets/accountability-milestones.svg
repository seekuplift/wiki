<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" role="img" aria-labelledby="t">
  <title id="t">An idea coin's round is released in steps: a small start when the plan is approved, then one part per approved milestone.</title>
  <g font-family="DM Sans, ui-sans-serif, sans-serif" text-anchor="middle">
    <text x="200" y="22" fill="#f0f4ff" font-size="14" font-weight="bold">One funding round</text>
    <rect x="8" y="40" width="384" height="44" rx="10" fill="#111827" stroke="rgba(255,255,255,0.15)"/>
    <rect x="10" y="42" width="36" height="40" rx="8" fill="#00d4aa"/>
    <rect x="50" y="42" width="110" height="40" rx="8" fill="#009f80"/>
    <rect x="164" y="42" width="110" height="40" rx="8" fill="#006b56"/>
    <rect x="278" y="42" width="112" height="40" rx="8" fill="#0d1221" stroke="rgba(255,255,255,0.15)" stroke-dasharray="4 3"/>
    <text x="28" y="67" fill="#06231c" font-size="12" font-weight="bold">≤10%</text>
    <text x="105" y="67" fill="#f0f4ff" font-size="13">Milestone 1</text>
    <text x="219" y="67" fill="#f0f4ff" font-size="13">Milestone 2</text>
    <text x="334" y="67" fill="#8892a4" font-size="13">Milestone 3</text>
    <g font-size="12" fill="#b4c0d4">
      <text x="28" y="108">plan</text><text x="28" y="124">approved</text>
      <text x="105" y="108">evidence</text><text x="105" y="124">approved</text>
      <text x="219" y="108">evidence</text><text x="219" y="124">approved</text>
      <text x="334" y="108">not yet</text><text x="334" y="124">released</text>
    </g>
    <text x="200" y="158" fill="#8892a4" font-size="12">Each part is released only after its review is approved</text>
  </g>
</svg>
