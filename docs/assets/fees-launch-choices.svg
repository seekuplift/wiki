<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" role="img" aria-labelledby="t3">
          <title id="t3">Three choices set once at launch and permanent: trading fee 1.25% or 10%; transfer fee none or on (default on for meme and idea coins); creator share kept (default) or 100% to the cause.</title>
          <g font-family="DM Sans, ui-sans-serif, sans-serif" font-size="12">
            <g id="lock">
              <rect x="16" y="6" width="368" height="24" rx="12" fill="rgba(0,212,170,0.12)"/>
              <rect x="30" y="16" width="10" height="8" rx="1.5" fill="#00d4aa"/>
              <path d="M32 16 v-3 a3 3 0 0 1 6 0 v3" fill="none" stroke="#00d4aa" stroke-width="1.6"/>
              <text x="48" y="22" fill="#a8ffe0">Set once at launch. Can't be changed later.</text>
            </g>
            <g id="c-trading">
              <text x="16" y="56" fill="#f0f4ff" font-weight="700">Trading fee</text>
              <rect x="16" y="64" width="180" height="30" rx="15" fill="none" stroke="#00d4aa" stroke-width="1.5"/>
              <text x="106" y="83" text-anchor="middle" fill="#f0f4ff">1.25%</text>
              <rect x="204" y="64" width="180" height="30" rx="15" fill="none" stroke="#ffb454" stroke-width="1.5"/>
              <text x="294" y="83" text-anchor="middle" fill="#f0f4ff">10%</text>
            </g>
            <g id="c-transfer">
              <text x="16" y="122" fill="#f0f4ff" font-weight="700">Transfer fee</text>
              <rect x="16" y="130" width="180" height="30" rx="15" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
              <text x="106" y="149" text-anchor="middle" fill="#b4c0d4">None</text>
              <rect x="204" y="130" width="180" height="30" rx="15" fill="#00d4aa"/>
              <text x="294" y="149" text-anchor="middle" fill="#06231c" font-weight="700">On: 1% or 10% · default</text>
            </g>
            <g id="c-cause">
              <text x="16" y="188" fill="#f0f4ff" font-weight="700">Creator's share</text>
              <rect x="16" y="196" width="180" height="30" rx="15" fill="#00d4aa"/>
              <text x="106" y="215" text-anchor="middle" fill="#06231c" font-weight="700">Creator keeps · default</text>
              <rect x="204" y="196" width="180" height="30" rx="15" fill="none" stroke="#a8ffe0" stroke-width="1.5"/>
              <text x="294" y="215" text-anchor="middle" fill="#a8ffe0">100% to cause</text>
            </g>
          </g>
        </svg>
