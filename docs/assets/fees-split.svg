<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-labelledby="t1">
          <title id="t1">How each fee is split. Trading fee, standard: Meteora 20%, creator 24%, SeekUplift 24%, cause 32%. Trading fee, all to cause: Meteora 20%, cause 80%. Transfer fee, standard: creator 30%, SeekUplift 30%, cause 40%. Transfer fee, all to cause: cause 100%.</title>
          <g font-family="DM Sans, ui-sans-serif, sans-serif" font-size="11" text-anchor="middle">
            <!-- Row 1 -->
            <text x="16" y="20" text-anchor="start" font-size="12" fill="#f0f4ff" font-weight="700">Trading fee <tspan fill="#8892a4" font-weight="400">· creator keeps share</tspan></text>
            <g id="r1">
              <rect x="16" y="28" width="73.6" height="40" rx="6" fill="#3a4459"/>
              <rect x="89.6" y="28" width="88.3" height="40" fill="#ffb454"/>
              <rect x="177.9" y="28" width="88.3" height="40" fill="#00d4aa"/>
              <rect x="266.2" y="28" width="117.8" height="40" rx="6" fill="#a8ffe0"/>
              <rect x="260" y="28" width="12" height="40" fill="#a8ffe0"/>
              <text x="52.8" y="44" fill="#d6dcea">Meteora</text><text x="52.8" y="60" fill="#f0f4ff" font-weight="700" font-size="13">20%</text>
              <text x="133.8" y="44" fill="#06231c">Creator</text><text x="133.8" y="60" fill="#06231c" font-weight="700" font-size="13">24%</text>
              <text x="222.1" y="44" fill="#06231c">SeekUplift</text><text x="222.1" y="60" fill="#06231c" font-weight="700" font-size="13">24%</text>
              <text x="325.1" y="44" fill="#06231c">Cause</text><text x="325.1" y="60" fill="#06231c" font-weight="700" font-size="13">32%</text>
            </g>
            <!-- Row 2 -->
            <text x="16" y="92" text-anchor="start" font-size="12" fill="#f0f4ff" font-weight="700">Trading fee <tspan fill="#8892a4" font-weight="400">· all to cause</tspan></text>
            <g id="r2">
              <rect x="16" y="100" width="73.6" height="40" rx="6" fill="#3a4459"/>
              <rect x="89.6" y="100" width="294.4" height="40" rx="6" fill="#a8ffe0"/>
              <rect x="89.6" y="100" width="12" height="40" fill="#a8ffe0"/>
              <text x="52.8" y="116" fill="#d6dcea">Meteora</text><text x="52.8" y="132" fill="#f0f4ff" font-weight="700" font-size="13">20%</text>
              <text x="236.8" y="116" fill="#06231c">Cause</text><text x="236.8" y="132" fill="#06231c" font-weight="700" font-size="13">80%</text>
            </g>
            <line x1="16" y1="162" x2="384" y2="162" stroke="rgba(255,255,255,0.12)" stroke-dasharray="3 4"/>
            <!-- Row 3 -->
            <text x="16" y="186" text-anchor="start" font-size="12" fill="#f0f4ff" font-weight="700">Transfer fee <tspan fill="#8892a4" font-weight="400">· creator keeps share</tspan></text>
            <g id="r3">
              <rect x="16" y="194" width="110.4" height="40" rx="6" fill="#ffb454"/>
              <rect x="120" y="194" width="10" height="40" fill="#ffb454"/>
              <rect x="126.4" y="194" width="110.4" height="40" fill="#00d4aa"/>
              <rect x="236.8" y="194" width="147.2" height="40" rx="6" fill="#a8ffe0"/>
              <rect x="236.8" y="194" width="10" height="40" fill="#a8ffe0"/>
              <text x="71.2" y="210" fill="#06231c">Creator</text><text x="71.2" y="226" fill="#06231c" font-weight="700" font-size="13">30%</text>
              <text x="181.6" y="210" fill="#06231c">SeekUplift</text><text x="181.6" y="226" fill="#06231c" font-weight="700" font-size="13">30%</text>
              <text x="310.4" y="210" fill="#06231c">Cause</text><text x="310.4" y="226" fill="#06231c" font-weight="700" font-size="13">40%</text>
            </g>
            <!-- Row 4 -->
            <text x="16" y="258" text-anchor="start" font-size="12" fill="#f0f4ff" font-weight="700">Transfer fee <tspan fill="#8892a4" font-weight="400">· all to cause</tspan></text>
            <g id="r4">
              <rect x="16" y="266" width="368" height="40" rx="6" fill="#a8ffe0"/>
              <text x="200" y="282" fill="#06231c">Cause</text><text x="200" y="298" fill="#06231c" font-weight="700" font-size="13">100%</text>
            </g>
          </g>
        </svg>
