<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-labelledby="t">
  <title id="t">Your agent asks SeekUplift for a transaction, your own wallet signs it, and it goes to Solana.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#00d4aa"/></marker>
  </defs>
  <g font-family="DM Sans, ui-sans-serif, sans-serif" text-anchor="middle" font-size="14">
    <rect x="8" y="104" width="384" height="88" rx="14" fill="none" stroke="#00d4aa" stroke-dasharray="5 4"/>
    <text x="200" y="186" fill="#00d4aa" font-size="12">stays with you</text>
    <rect x="20" y="10" width="140" height="56" rx="12" fill="#111827" stroke="rgba(255,255,255,0.15)"/>
    <text x="90" y="34" fill="#f0f4ff">SeekUplift</text>
    <text x="90" y="52" fill="#b4c0d4" font-size="12">builds the transaction</text>
    <rect x="20" y="114" width="110" height="50" rx="12" fill="#111827" stroke="rgba(255,255,255,0.15)"/>
    <text x="75" y="144" fill="#f0f4ff">Your agent</text>
    <rect x="145" y="114" width="110" height="50" rx="12" fill="#06231c" stroke="#00d4aa"/>
    <text x="200" y="136" fill="#a8ffe0" font-weight="bold">Your wallet</text>
    <text x="200" y="153" fill="#a8ffe0" font-size="12">signs</text>
    <rect x="270" y="10" width="110" height="56" rx="12" fill="#111827" stroke="rgba(255,255,255,0.15)"/>
    <text x="325" y="43" fill="#f0f4ff">Solana</text>
    <path d="M60 114 V68" stroke="#00d4aa" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <path d="M120 66 V88 H200 V112" stroke="#00d4aa" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <path d="M255 139 H325 V68" stroke="#00d4aa" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <text x="36" y="94" fill="#b4c0d4" font-size="11" text-anchor="start">asks</text>
  </g>
</svg>
