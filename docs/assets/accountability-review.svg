<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img" aria-labelledby="t">
  <title id="t">AI reviews each submission and gives a verdict with a reason. A person steps in when needed.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#00d4aa"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffb454"/></marker>
  </defs>
  <g font-family="DM Sans, ui-sans-serif, sans-serif" font-size="14" text-anchor="middle">
    <rect x="8" y="20" width="110" height="60" rx="12" fill="#111827" stroke="rgba(255,255,255,0.15)"/>
    <text x="63" y="46" fill="#f0f4ff">Plan, evidence</text>
    <text x="63" y="64" fill="#f0f4ff">or update</text>
    <rect x="145" y="20" width="110" height="60" rx="12" fill="#06231c" stroke="#00d4aa"/>
    <text x="200" y="55" fill="#a8ffe0" font-weight="bold">AI review</text>
    <rect x="282" y="20" width="110" height="60" rx="12" fill="#111827" stroke="rgba(255,255,255,0.15)"/>
    <text x="337" y="46" fill="#f0f4ff">Verdict</text>
    <text x="337" y="64" fill="#f0f4ff">+ reason</text>
    <line x1="118" y1="50" x2="143" y2="50" stroke="#00d4aa" stroke-width="2" marker-end="url(#a)"/>
    <line x1="255" y1="50" x2="280" y2="50" stroke="#00d4aa" stroke-width="2" marker-end="url(#a)"/>
    <rect x="145" y="150" width="110" height="50" rx="12" fill="#111827" stroke="#ffb454"/>
    <text x="200" y="180" fill="#ffb454" font-weight="bold">A person</text>
    <line x1="200" y1="80" x2="200" y2="148" stroke="#ffb454" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#b)"/>
    <text x="100" y="112" fill="#b4c0d4" font-size="12">unsure, suspicious,</text>
    <text x="100" y="128" fill="#b4c0d4" font-size="12">or limit reached</text>
    <path d="M337 80 V175 H257" fill="none" stroke="#ffb454" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#b)"/>
    <text x="330" y="208" fill="#b4c0d4" font-size="12">human review on request</text>
  </g>
</svg>
